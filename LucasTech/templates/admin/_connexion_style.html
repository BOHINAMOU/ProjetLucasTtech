{% extends 'users/_auth.html' %}
{% block title %}{% block titre %}Connexion{% endblock %} — Administration Lantante{% endblock %}
{% block phrase %}Administration de Lantante.{% endblock %}
{% block extra_head %}
<style>
  p.sous { color:var(--gris); margin:0 0 24px; font-size:.95rem; line-height:1.55; }
  .auth-card h1 { margin-bottom:6px; }
  .auth-card label { display:block; margin:0 0 6px; }
  .auth-card form > input + label, .auth-card form > label + input + label { margin-top:4px; }
  .auth-card form { gap:10px !important; }
  .auth-card form > button[type=submit] { margin-top:8px; }
  .lien { background:none; border:0; color:var(--vert); font-weight:600; cursor:pointer; font-family:inherit; font-size:.9rem; padding:0; }
  .erreur { background:#FDECEA; color:#B42318; border:1px solid #F5C2BC; border-radius:10px; padding:11px 14px; font-size:.9rem; margin-bottom:16px; }
  .info { background:var(--vert-c); color:var(--vert-f); border-radius:10px; padding:11px 14px; font-size:.9rem; margin-bottom:16px; }
  .pied { text-align:center; margin-top:20px; color:var(--gris); font-size:.88rem; }
  .cases { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:4px 0 12px; }
  .cases input { width:100% !important; height:56px !important; padding:0 !important; text-align:center; font-size:1.4rem !important; font-weight:700; }
  .auth-card label.retenir { display:flex; align-items:center; gap:8px; font-size:.9rem; font-weight:500; margin:4px 0 6px; }
  .retenir input { width:18px; height:18px; accent-color:var(--vert); }
</style>
{% endblock %}
{% block content %}<div class="auth-card">{% block corps %}{% endblock %}</div>{% endblock %}
