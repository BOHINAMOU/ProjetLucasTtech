<style>
.rp { --g:#0f7a45; --gd:#0b2e1d; --ink:#1d1d1f; --gray:#6e6e73; --line:#e3e8e5;
  max-width: 820px; margin: 0 auto; padding: clamp(1.2rem,4vw,2.5rem) clamp(1rem,4vw,1.5rem) 4rem; color: var(--ink); }
.rp-banniere { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  border-radius: 22px; padding: clamp(1.3rem,4vw,2rem); margin-bottom: 20px; color: #fff;
  background: radial-gradient(120% 140% at 0% 0%, #17a35f 0%, #0b6137 45%, #0b2e1d 100%); }
.rp-banniere h1 { margin: 0; font-size: clamp(1.6rem,4vw,2.2rem); font-weight: 800; letter-spacing: -.02em; color: #fff; }
.rp-banniere p { margin: 6px 0 0; color: #dcf3e6; }
.rp-lien { color: #fff !important; font-weight: 700; text-decoration: underline; white-space: nowrap; }
.rp-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: clamp(1rem,3vw,1.5rem); margin-bottom: 16px; }
.rp-card h2 { font-size: 1.12rem; font-weight: 800; margin: 0 0 14px; color: var(--gd); }
.rp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 18px; }
.rp-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.rp-field label { font-weight: 600; font-size: .92rem; }
.rp-field label b { color: #c62828; font-weight: 700; }
.rp-field input[type=text], .rp-field input[type=email], .rp-field input[type=tel], .rp-field input[type=file],
.rp-field select, .rp-field textarea, .rp-niv {
  width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1.5px solid #d5ddd8; border-radius: 12px; font: inherit; background: #fff; }
.rp-field input:focus, .rp-field select:focus, .rp-field textarea:focus, .rp-niv:focus-within { outline: none; border-color: var(--g); }
.rp-field em { color: #c62828; font-style: normal; font-size: .86rem; }
.rp-err input, .rp-err select, .rp-err textarea, .rp-err .rp-niv { border-color: #c62828; }
.rp-note { color: var(--gray); font-size: .86rem; margin: 0; }
.rp-piege { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.rp-niv { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 7px 9px; }
.rp-niv input { border: 0 !important; padding: 4px !important; flex: 1; min-width: 120px; outline: none; }
.rp-niv-choix { display: contents; }
.rp-puce { border: 0; background: #e6f4ec; color: var(--gd); border-radius: 20px; padding: 5px 11px; font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; }
.rp-niv-liste { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px 0;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 24px rgba(0,0,0,.12); max-height: 240px; overflow: auto; }
.rp-niv-liste li { padding: 9px 14px; cursor: pointer; }
.rp-niv-liste li:hover { background: #eef6f1; }
.rp-alert { background: #fff4e5; border: 1px solid #f3c27a; color: #6b3d00; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.rp-ok { background: #eaf7ef; border-color: #a8dcbc; color: var(--gd); }
.rp-btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 15px 22px; border: 0; border-radius: 14px;
  background: var(--g); color: #fff !important; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; text-decoration: none; }
.rp-btn:hover { background: #0b6137; }
.rp-btn--ghost { background: #fff; color: var(--g) !important; border: 1.5px solid var(--g); }
.rp-statut { display: inline-block; padding: 5px 13px; border-radius: 30px; font-weight: 700; background: #eef6f1; color: var(--gd); }
.rp-statut.a_corriger { background: #fff4e5; color: #6b3d00; } .rp-statut.rejetee { background: #fdecea; color: #8a1c1c; }
.rp-statut.validee { background: #e3f6ea; color: #0b6137; }
.rp-hero { text-align: left; margin-bottom: 18px; }
.rp-hero h1 { margin: 0; font-size: clamp(1.6rem,4vw,2.2rem); font-weight: 800; }
.rp-hero .rp-kicker { display: none; }
.rp-sub { color: var(--gray); margin: 6px 0 0; }
.rch-rien{color:#6e6e73;text-align:center;padding:18px 0}
</style>
