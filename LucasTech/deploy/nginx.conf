# ─────────────────────────────────────────────────────────────
# Bloc serveur Nginx pour LucasTech.
#
# Comme vous hébergez déjà un autre site sur ce VPS Hostinger, ce fichier
# est indépendant du reste de votre config Nginx : il ne touche à rien
# d'existant, il ajoute juste un nouveau server{} pour ce domaine.
#
# Installation :
#   1. Adapter le domaine et les chemins ci-dessous.
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/lucastech
#   3. sudo ln -s /etc/nginx/sites-available/lucastech /etc/nginx/sites-enabled/
#   4. sudo nginx -t          # vérifie la syntaxe avant de recharger
#   5. sudo systemctl reload nginx
#
# Ensuite, pour activer le HTTPS (une fois le DNS du domaine pointé sur
# l'IP du serveur) :
#   sudo apt install certbot python3-certbot-nginx   # si pas déjà installé
#   sudo certbot --nginx -d lucastech.tg -d www.lucastech.tg
# certbot réécrit automatiquement ce fichier pour ajouter le HTTPS.
# Une fois confirmé que ça marche, mettre USE_HTTPS=True dans le .env
# du projet et redémarrer : sudo systemctl restart lucastech
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name lucastech.tg www.lucastech.tg;

    client_max_body_size 20M;

    # Fichiers statiques (CSS/JS/images du thème), collectés par
    # `python manage.py collectstatic`.
    location /static/ {
        alias /home/lucastech/lucastech/LucasTech/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Fichiers médias (logos, photos produits, uploads...).
    location /media/ {
        alias /home/lucastech/lucastech/LucasTech/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/lucastech/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
