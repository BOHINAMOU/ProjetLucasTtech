# ─────────────────────────────────────────────────────────────
# Bloc serveur Nginx pour LucasTech.
#
# Comme vous hébergez déjà un autre site sur ce VPS Hostinger, ce fichier
# est indépendant du reste de votre config Nginx : il ne touche à rien
# d'existant, il ajoute juste un nouveau server{}.
#
# ⚠️ PAS ENCORE DE DOMAINE : Nginx route les sites par nom d'hôte (le
# domaine dans l'en-tête Host). Sans domaine, deux sites sur la même IP
# au port 80 ne peuvent pas cohabiter proprement — celui de vos deux
# server{} marqué "default_server" (ou déclaré en premier) répondrait
# à toutes les requêtes sur l'IP nue, y compris pour l'autre site.
# On fait donc tourner LucasTech sur un port dédié (8080) en attendant :
# accessible via http://VOTRE_IP:8080
#
# Quand vous aurez un domaine (ex: lucastech.tg pointé en DNS vers cette
# IP) : remplacez `listen 8080;` par `listen 80;`, remplacez
# `server_name _;` par votre domaine, puis activez le HTTPS :
#   sudo apt install certbot python3-certbot-nginx   # si pas déjà installé
#   sudo certbot --nginx -d lucastech.tg -d www.lucastech.tg
# certbot réécrit automatiquement ce fichier pour ajouter le HTTPS.
# Une fois confirmé que ça marche, mettre USE_HTTPS=True dans le .env
# du projet et redémarrer : sudo systemctl restart lucastech
#
# Installation :
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/lucastech
#   2. sudo ln -s /etc/nginx/sites-available/lucastech /etc/nginx/sites-enabled/
#   3. sudo nginx -t          # vérifie la syntaxe avant de recharger
#   4. sudo systemctl reload nginx
#   5. Vérifier que le port 8080 est ouvert : sudo ufw allow 8080/tcp
#      (si ufw est actif — sinon vérifier le pare-feu Hostinger dans hPanel)
# ─────────────────────────────────────────────────────────────

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20M;

    # Fichiers statiques (CSS/JS/images du thème), collectés par
    # `python manage.py collectstatic`.
    location /static/ {
        alias /home/lucastech/lucastech/LucasTech/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Fichiers médias (logos, photos produits, uploads...).
    location /media/ {
        alias /home/lucastech/lucastech/LucasTech/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/lucastech/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
