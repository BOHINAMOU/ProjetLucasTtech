<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{ titre }}</title>
</head>
<body style="margin:0;padding:0;background:#EEF2EF;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF2EF;">
  <tr><td align="center" style="padding:28px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #DDE5E0;">
      <tr><td bgcolor="#0B5A38" style="background:#0B5A38;padding:0;line-height:0;">
        <a href="{{ site }}" style="text-decoration:none;"><img src="{{ site }}/static/email/banniere.jpg" width="600" alt="Lantante Technologie" style="display:block;width:100%;max-width:600px;height:auto;border:0;color:#ffffff;font-family:Arial,sans-serif;font-size:22px;font-weight:bold;line-height:1.4;"></a>
      </td></tr>
      <tr><td style="padding:34px 36px 8px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <h1 style="margin:0 0 18px;font-size:22px;line-height:1.3;color:#14231B;font-weight:800;">{{ titre }}</h1>
        {% for type, v in blocs %}
          {% if type == 'p' %}
            <p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:#33433A;">{{ v }}</p>
          {% elif type == 'code' %}
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 20px;">
              <tr><td align="center" bgcolor="#E3F5EC" style="background:#E3F5EC;border:2px dashed #8CCBA9;border-radius:14px;padding:20px 10px;">
                <div style="font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#0A5C39;font-weight:600;margin-bottom:6px;">Votre code</div>
                <div style="font-family:'Courier New',Courier,monospace;font-size:36px;line-height:1.1;letter-spacing:12px;font-weight:700;color:#0B2E1D;padding-left:12px;">{{ v }}</div>
              </td></tr>
            </table>
          {% elif type == 'bouton' %}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0 22px;">
              <tr><td align="center" bgcolor="#0B7A4B" style="background:#0B7A4B;border-radius:10px;">
                <a href="{{ v.1 }}" style="display:inline-block;padding:14px 28px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">{{ v.0 }}</a>
              </td></tr>
            </table>
          {% endif %}
        {% endfor %}
        <p style="margin:8px 0 26px;font-size:15px;line-height:1.6;color:#33433A;">L'équipe Lantante</p>
      </td></tr>
      <tr><td style="padding:20px 36px 26px;border-top:1px solid #E5EAE7;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <p style="margin:0 0 4px;font-size:12px;line-height:1.6;color:#7C8B83;"><b style="color:#33433A;">Lantante Technologie</b> · Lomé, Togo</p>
        <p style="margin:0;font-size:12px;line-height:1.6;color:#7C8B83;"><a href="{{ site }}" style="color:#0B7A4B;text-decoration:none;font-weight:600;">lantantetechnologie.com</a> · Ceci est un message automatique.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
