<style>
.sr{padding:18px clamp(12px,4vw,32px) 6px;max-width:1200px;margin:0 auto}
.sr-liste{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sr-liste a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;border:2px solid #E3F5EC;color:#0b2e1d!important;font-weight:700;font-size:.95rem;text-decoration:none!important;white-space:nowrap;box-shadow:0 4px 12px rgba(11,46,29,.06);transition:border-color .15s,transform .15s}
.sr-liste a i{color:#0B7A4B}
.sr-liste a:hover{border-color:#D4A017;transform:translateY(-1px)}
.sr-liste a.sr-contact{background:#0B7A4B;border-color:#0B7A4B;color:#fff!important}
.sr-liste a.sr-contact i{color:#F2C94C}
@media (max-width:700px){.sr-liste{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;-webkit-overflow-scrolling:touch}.sr-liste::-webkit-scrollbar{display:none}}
</style>
{% with wa=site_settings.whatsapp_1 %}
<section class="sr" aria-label="Services">
  <div class="sr-liste">
    {% for icone, nom in services_rapides %}<a href="https://wa.me/{{ wa }}?text={{ 'Bonjour Lantante Technologie, je suis intéressé par : '|urlencode }}{{ nom|urlencode }}." target="_blank" rel="noopener"><i class="fas {{ icone }}"></i> {{ nom }}</a>{% endfor %}
    <a class="sr-contact" href="{% url 'core:contact' %}"><i class="fas fa-envelope"></i> Nous contacter</a>
  </div>
</section>
{% endwith %}
