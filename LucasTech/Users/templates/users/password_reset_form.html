{% extends 'core/base.html' %}

{% block content %}
<div style="max-width:500px;margin:50px auto;padding:25px;background:#0d1121;border-radius:12px;color:white;">

  <h2>Réinitialiser le mot de passe</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit"
            style="padding:10px 15px;background:#00d4ff;border:none;border-radius:8px;font-weight:600;">
      Envoyer le lien
    </button>
  </form>

</div>
{% endblock %}
