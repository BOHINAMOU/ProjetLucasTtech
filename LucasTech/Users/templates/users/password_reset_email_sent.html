{% extends 'users/_auth.html' %}
{% block title %}Code envoyé — Lantante Technologie{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="check-icon">✓</div>

    <h1>Code envoyé</h1>

    <p>Un code à 6 chiffres vient d’être envoyé à votre adresse e-mail. Pensez à regarder dans les spams.</p>

    <a href="{% url 'users:password_reset_verify' %}" class="btn-auth">
      Saisir le code reçu
    </a>

    <a href="{% url 'users:password_reset' %}" class="secondary-btn">
      Renvoyer un autre code
    </a>

  </div>
</div>
{% endblock %}
