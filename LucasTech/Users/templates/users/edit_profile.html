{% extends 'core/base.html' %}

{% block content %}
<style>
:root {
  --navy:#05070f;
  --navy2:#0d1121;
  --accent:#00d4ff;
  --accent2:#7b5cf5;
  --white:#eef0f8;
  --muted:#8892b0;
}

.edit-profile {
  max-width: 650px;
  margin: 60px auto;
  padding: 32px;
  background: var(--navy2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  animation: fadeUp .5s ease;
}

.edit-profile h2 {
  font-family: 'Syne', sans-serif;
  color: var(--white);
  margin-bottom: 25px;
  font-size: 1.6rem;
}

/* Form layout */
.form-group {
  margin-bottom: 18px;
}

/* Labels */
.form-group label {
  display: block;
  font-size: .85rem;
  color: var(--muted);
  margin-bottom: 6px;
}

/* Inputs */
.form-group input,
.form-group select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.03);
  color: var(--white);
  outline: none;
  transition: .2s;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
}

/* Button */
.btn-save {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  margin-top: 10px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #05070f;
  transition: .2s;
}

.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0,212,255,0.2);
}

@keyframes fadeUp {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>

<div class="edit-profile">

  <h2> Modifier mon profil</h2>

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      {{ form.phone.label }}
      {{ form.phone }}
    </div>

    <div class="form-group">
      {{ form.country.label }}
      {{ form.country }}
    </div>

    <div class="form-group">
      {{ form.city.label }}
      {{ form.city }}
    </div>

    <div class="form-group">
      {{ form.date_of_birth.label }}
      {{ form.date_of_birth }}
    </div>

    <button type="submit" class="btn-save">
      Enregistrer les modifications
    </button>

  </form>

</div>
{% endblock %}
