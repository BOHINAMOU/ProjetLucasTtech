{% extends 'core/base.html' %}
{% block title %}Mot de passe modifié — LucasTech{% endblock %}
{% block content %}
<style>
:root{--navy:#05070f;--navy2:#0d1121;--accent:#00d4ff;--accent2:#7b5cf5;--white:#eef0f8;--muted:#8892b0;--green:#00d278;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);}
.auth-page{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.auth-card{width:100%;max-width:440px;background:var(--navy2);border:1px solid rgba(0,210,120,.2);border-radius:20px;padding:48px 44px;box-shadow:0 24px 80px rgba(0,0,0,.4);text-align:center;animation:fadeUp .5s ease both;}
.check-icon{width:72px;height:72px;border-radius:50%;background:rgba(0,210,120,.12);border:1px solid rgba(0,210,120,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.8rem;color:var(--green);}
h1{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
p{font-size:.92rem;color:var(--muted);line-height:1.7;margin-bottom:28px;}
.btn-auth{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03050c;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .2s,transform .15s;}
.btn-auth:hover{opacity:.9;transform:translateY(-1px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
</style>
<div class="auth-page">
  <div class="auth-card">
    <div class="check-icon"><i class="fa fa-check"></i></div>
    <h1>Mot de passe modifié !</h1>
    <p>Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.</p>
    <a href="{% url 'users:login' %}" class="btn-auth">
      <i class="fa fa-sign-in-alt"></i> Se connecter
    </a>
  </div>
</div>
{% endblock %}
