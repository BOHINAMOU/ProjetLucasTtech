{% extends 'marche/espace/_auth.html' %}
{% block titre %}Connexion{% endblock %}
{% block auth %}
<h1>{{ v.boutique }}</h1>
<p class="sous">Espace vendeur</p>
{% if erreur %}<div class="alerte">{{ erreur }}</div>{% endif %}
<form method="post">
  {% csrf_token %}
  <div class="champ"><label for="email">E-mail</label><input type="email" id="email" name="email" required autocomplete="email"></div>
  <div class="champ"><label for="password">Mot de passe</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
  <button class="btn" type="submit">Se connecter</button>
</form>
<a class="lien" href="{% url 'espace:oubli' v.code %}">Mot de passe oublié ?</a>
{% endblock %}
